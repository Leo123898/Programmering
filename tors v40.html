<body>
     <script src="http://koda.nu/simple.js">   
        





        var player = { x: 100, y: 300, size: 20, color: "blue", speed: 4, liv: 3 };
var poang = 0; 
var zombie1 = { x: 300, y: 220, speed: 3 };
var zombie2 = { x: 500, y: 400, speed: 2 };
var zombie3 = { x: 700, y: 260, speed: 2 };
var textColor




function drawZombie(x, y) {
  rectangle(x + 3, y - 10, 23, 65, "lightgreen");
  rectangle(x + 3, y - 25, 23, 65, "gray");
  circle(x + 15, y - 40, 20, "lightgreen");
  circle(x, y - 40, 3, "red");
  rectangle(x - 35, y - 20, 30, 14, "lightgreen");
  rectangle(x - 20, y - 20, 30, 14, "gray");
}

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);

    circle(player.x, player.y, player.size, player.color);
    


  circle(player.x, player.y, player.size, player.color);

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }

  if (zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (zombie1.x > player.x) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if (zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }


  if (zombie2.x < player.x) {
    zombie2.x = zombie2.x + zombie2.speed;
  }
  if (zombie2.x > player.x) {
    zombie2.x = zombie2.x - zombie2.speed;
  }
  if (zombie2.y < player.y) {
    zombie2.y = zombie2.y + zombie2.speed;
  }
  if (zombie2.y > player.y) {
    zombie2.y = zombie2.y - zombie2.speed; 
  }
  if (zombie3.x < player.x) {
    zombie3.x = zombie3.x + zombie3.speed;
  }
  if (zombie3.x > player.x) {
    zombie3.x = zombie3.x - zombie3.speed;
  }
  if (zombie3.y < player.y) {
    zombie3.y = zombie3.y + zombie3.speed;
  }
  if (zombie3.y > player.y) {
    zombie3.y = zombie3.y - zombie3.speed; 
  }

  // STEG 2: poäng och GAME OVER kommer här
  if (distance(player, zombie1) < 60) {
    // text(280, 250, 50, "GAME OVER", "red"); 
   player.liv = player.liv - 1; 
   zombie1.x = random (totalWidth);
   zombie1.y = random (totalHeight); 
     if( distance(player, zombie1) < 60) { 
      zombie1.x = random (totalWidth);
      zombie1.y = random (totalHeight); 
     
    }


    if (player.liv == 0) {  text(280, 250, 50, "GAME OVER", "red"); 
    stopUpdate(); } } else {
    poang = poang + 1;
    text(20, 70, 24, "Poäng: " + poang, "black"); 
    if(distance(player, zombie1) < 150) {
      text(20, 100, 24, "Zombie NÄRA!", "red");
    } 
text(300, 50, 24, "Liv: " + player.liv, textColor); 
if( player.liv == 3 ) { textColor = "green" } 
 else if( player.liv == 2 ) { textColor = "orange" } 
 else if( player.liv == 1 ) { textColor = "red" } 
 else if( player.liv == 0 ) { textColor = "black" } 
}
    if (poang > 999) { text(280, 250, 50, "DU VANN!", "green"); // när poängen är större än 999, skriv ut "DU VANN!" och stoppa spelet 
    stopUpdate(); } 

if( player.x >= totalWidth) { player.x = totalWidth; }
if( player.y >= totalHeight) { player.y = totalHeight; } 
if( player.x <= 0) { player.x = 0; }
if( player.y <= 0) { player.y = 0; } 
// player kan inte gå utanför skärmen. 
    


}

var player = {
    x: 300,
    y: 400,

    color: "red",

    {x: 150, y: 100, size: 8},

    {x: 500, y: 350, size: 8},
    {x: 100, y: 300, size: 8},
    {x: 350, y: 150, size: 8}
];

function update() {

   
   fill("Black"); 

    circle(enemy.x, enemy.y, enemy.size, "white");
    rectangle(enemy.x - 25, enemy.y, 50, 25, "white");
    circle(enemy.x - 10, enemy.y - 5, 5, "black");
    circle(enemy.x + 10, enemy.y - 5, 5, "black");
    circle(enemy.x, enemy.y + 10, 4, "black");

   
    circle(player.x, player.y, player.size, player.color);




for (var i = 0; i < coins.length; i++) {

  
    circle(coins[i].x, coins[i].y, coins[i].size, "orange");

    
    if (distance(player, coins[i]) < 30) {
        poang = poang + 1;

        
        coins[i].x = random(20, totalWidth - 20);
        coins[i].y = random(20, totalHeight - 20);
    }
}

 if (keyboard.d) {

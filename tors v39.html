<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">       

var speed = prompt("Hur snabb?")




var player = { x: 100, y: 300, size: 20, color: "red", speed: 4 };







var zombie1 = { x: 300, y: 220 };
var zombie2 = { x: 500, y: 400 };
var zombie3 = { x: 700, y: 260 };
var zombie4 = { x: 900, y: 400 }; 
var zombie5 = {x: 1100, y: 220 };




function drawZombie(x, y) {
rectangle(x + 3, y - 10, 23, 65, "lightgreen")
rectangle(x + 3, y - 25, 23, 65, "gray")
circle(x + 15, y - 40, 20, "lightgreen")
circle(x, y - 40, 3, "red")
rectangle(x - 35, y - 20, 30, 14, "lightgreen")
rectangle(x - 20, y - 20, 30, 14, "gray") }

function drawPlayer(x, y) {
circle( x - 8, y, 5, "black") 
circle( x + 8, y, 5, "black")







}




// STEG 1a: skriv funktionen drawZombie här

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  // STEG 1b: rita de tre zombierna här
    drawZombie(zombie1.x, zombie1.y);
    drawZombie(zombie2.x, zombie2.y);
    drawZombie(zombie3.x, zombie3.y);
    drawZombie(zombie4.x, zombie4.y)
    drawZombie(zombie5.x, zombie5.y)
    drawPlayer(player.x, player.y) 

zombie1.x = zombie1.x - speed
zombie2.x = zombie2.x - speed
zombie3.x = zombie3.x - speed
zombie4.x = zombie4.x - speed
zombie5.x = zombie5.x - speed 


circle(player.x, player.y, player.size, player.color);
  circle(player.x - 8, player.y, player.size - 15, "black");
circle(player.x + 8, player.y, player.size - 15, "black")

  if (keyboard.d) {
    player.x = player.x + player.speed;
  }
  if (keyboard.a) {
    player.x = player.x - player.speed;
  }
  if (keyboard.w) {
    player.y = player.y - player.speed;
  }
  if (keyboard.s) {
    player.y = player.y + player.speed;
  }

  if (distance(player, zombie1) <60) {
    player.size = player.size + 10 }
    else{player.size = 20} 

    if(distance(player, zombie1) <60) {
        zombie1 = "white" 
    }



    if(player.size >30) {player.size = 100} 

  // STEG 2: träffkollen kommer här
  //i varje distance behöver zombie vara unik
  
     
  

  if (distance(player, zombie2)  <60) {
    text(20, 70, 30, "AJ!", "red")
    zombie2 = "white" 
  }

 if (distance(player, zombie3)  <60) {
    text(20, 70, 30, "AJ!", "red")
    zombie3 = "white"
  }

 if (distance(player, zombie4)  <60) {
    text(20, 70, 30, "AJ!", "red") 
           zombie4 = "white" 
 }
if (distance(player, zombie5)  <60) {  
    text(20, 70, 30, "AJ!", "red") 
    zombie5 = "white" }

console.log(distance(player, zombie1))
}







    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <script src="http://koda.nu/simple.js">
        
        
        
        var player = { 
            x:800, 
            y: 500, 
            size: 40, 
            color: "blue",
            speedX: 2,     // med -2 går den åt vänster,
           speedY:  10 // med 0 går den rakt fram,   
        }

        function update() {
        clearScreen()

        circle(player.x, player.y, player.size, player.color)
        player.x = player.x + player.speedX
         player.y = player.y + player.speedY 


        if(player.x >= totalWidth) { player.x = 0; }
        if(player.y >= totalHeight) { player.y = 0; } 


        }
        
        
        
        
        
        
        </script>
    









</body>

}

circle(15, -28, 3, "black");

circle(7, -15, 2, "black")
rectangle(-2, -40, 25, 5, "black")
rectangle(1, -57, 20, 18, "black")
restore()
}

function drawGift(x, y) {  // function till gifts
save()
translate(x, y)
circle (30, 30, 20, 20, "red")
rectangle(10, 10, 40, 40, "red"); 
    rectangle(10, 26, 40, 7, "yellow");
    rectangle(27, 10, 7, 40, "yellow");

}

function update() {
    clearScreen()
     fill("grey")
    
rectangle(door.x, door.y, 60, 80, door.color)     
    text(1497, 499, 20, "DOOR", "black")
    if(lämnaGifts >= giftsneeded) {text(1510, 545, 12, "OPEN", "black")} else{text(1500, 545, 12, "LOCKED", "black")}  // om paketen du har lämnat är samma eller större än paket man behöver står det Open på dörren annars står det locked.

    var i = 0;
while(i < level) { // loop för enemys övr med 1 varje level 

    drawEnemy(enemies[i].x, enemies[i].y);

    if (enemies[i].x < player.x) {
    enemies[i].x = enemies[i].x + enemies[i].speed;
}
if (enemies[i].x > player.x) {
    enemies[i].x = enemies[i].x - enemies[i].speed;
}
if (enemies[i].y < player.y) {
    enemies[i].y = enemies[i].y + enemies[i].speed;
}
if (enemies[i].y > player.y) {
    enemies[i].y = enemies[i].y - enemies[i].speed;
}
if (distance(player.x, player.y, enemies[i].x + 10, enemies[i].y + 10) < 30) {
    text(300, 300, 50, "GAME OVER", "red");
    stopUpdate();
}
    i++;
}
   

for (var j = 0; j < gifts.length; j++) {    // loop för gifts + när man tar upp en kommer den tillbaka på random ställe 
    drawGift(gifts[j].x, gifts[j].y )
if (distance(player.x, player.y, gifts[j].x + 30, gifts[j].y + 30) < 30) {
    collectedGifts = collectedGifts + 1 

        gifts[j].x = random(20, totalWidth - 20);
        gifts[j].y = random(20, totalHeight - 20); }

}
if (distance(player.x, player.y, door.x, door.y + 40) < 50) {lämnaGifts = lämnaGifts + collectedGifts // När player går vid dörren lämnar du dina gifts som omvandlars till poäng

    collectedGifts = 0
}

    door.color = "green"
}

if(door.color == "green" && distance(player.x, player.y, door.x + 10, door.y + 40) <50) { // om dörren är grön och spelaren går nära på dörren, level höjs med 1 + gifts needed för näsat nivå höjs med 2, gifts lämnade blir 0, dörren blir brun och spelaren går tillbaka till start position 
     level = level + 1
     giftsneeded = giftsneeded + 2
     lämnaGifts = 0
     door.color = "brown"
     player.x = 500
     player.y = 400

}


if(keyboard.d) {                             // du rör spelaren med wasd tangenterna
   player.x = player.x + player.speed;
}
if(keyboard.a) {
    player.x = player.x - player.speed; 
}
if(keyboard.w) {
    player.y = player.y - player.speed; 
}
if(keyboard.s) {
    player.y = player.y + player.speed; 
}

text(20, 40, 30, "Point: " + poang, "black");      // står poäng på skärmen och höjs varje gång du får ett poäng

// Psuedokod  
//När spelet uppdateras: 
//loopar enemy, gifts på olika ställen.
//flytta spelaren med WSAD.
//låt spelaren samla gifts och undvika enemy.  

// Psuedokod 
//Håll spelaren inom spel plannen
//om spelare tar upp gift + 1 poäng
//om spelare tar upp gift 25% att du får skott. 
//enemy nuddar player= gameover


var enemies = [{x: 100, y:150, speed: 2},
             {x: 100, y: 250, speed: 3},
             {x: 100, y: 400, speed: 4  },
             {x: 100, y: 550, speed: 4.5},
             {x: 100, y: 700, speed: 5}
]

var gifts = [ {x: 500, y: 100, },
                { x: 700, y: 250}, 
                { x: 900, y: 400}, 
                { x: 1100, y: 550}, 
                { x: 1300, y: 700}, ]


var door = {x: 1500, y: 500, color: "Brown"}



var player = { x: 500, y: 400, size: 20, color: "blue", speed: 5
}

var collectedGifts = 0 

var level = 1
var poang = 0

var giftsneeded = 10 

var lämnaGifts = 0 


function drawEnemy(x, y) {
save()
translate(x, y)
circle(10, 10, 20, "white"); 
circle(10, -25, 16, "white");
circle(5, -28, 3, "black");
circle(15, -28, 3, "black");
circle(10, -22, 3, "orange");
circle(4, -17, 2, "black") 
circle(17, -17, 2, "black")
circle(11, -14, 2, "black")
circle(14, -15, 2, "black")
circle(7, -15, 2, "black")
rectangle(-2, -40, 25, 5, "black")
rectangle(1, -57, 20, 18, "black")
restore()
}

function drawGift(x, y) {
save()
translate(x, y)
circle (30, 30, 20, 20, "red")
rectangle(10, 10, 40, 40, "red"); 
    rectangle(10, 26, 40, 7, "yellow");
    rectangle(27, 10, 7, 40, "yellow");
    circle(30.8, 7, 6, "yellow");
    restore()
}



function update() {
    fill("grey")

rectangle(door.x, door.y, 60, 80, door.color)
    text(1497, 499, 20, "DOOR", "black")
    if(lämnaGifts >= giftsneeded) {text(1510, 545, 12, "OPEN", "black")} else{text(1500, 545, 12, "LOCKED", "black")}  

circle(player.x, player.y, player.size, player.color, player.speed)



    var i = 0;
while(i < level) {

    drawEnemy(enemies[i].x, enemies[i].y);

    if (enemies[i].x < player.x) {
    enemies[i].x = enemies[i].x + enemies[i].speed;
}
if (enemies[i].x > player.x) {
    enemies[i].x = enemies[i].x - enemies[i].speed;
}
if (enemies[i].y < player.y) {
    enemies[i].y = enemies[i].y + enemies[i].speed;
}
if (enemies[i].y > player.y) {
    enemies[i].y = enemies[i].y - enemies[i].speed;
}
if (distance(player.x, player.y, enemies[i].x + 10, enemies[i].y + 10) < 30) {
    text(300, 300, 50, "GAME OVER", "red");
    stopUpdate();
}
    i++;
}
   

for (var j = 0; j < gifts.length; j++) {
    drawGift(gifts[j].x, gifts[j].y )
if (distance(player.x, player.y, gifts[j].x + 30, gifts[j].y + 30) < 30) {
    collectedGifts = collectedGifts + 1

        gifts[j].x = random(20, totalWidth - 20);
        gifts[j].y = random(20, totalHeight - 20); }

}
if (distance(player.x, player.y, door.x, door.y + 40) < 70) {lämnaGifts = lämnaGifts + collectedGifts
    poang = poang + collectedGifts
    collectedGifts = 0
}
if (lämnaGifts >= giftsneeded) {
    door.color = "green"
}



if(keyboard.d) {
   player.x = player.x + player.speed;
}
if(keyboard.a) {
    player.x = player.x - player.speed; 
}
if(keyboard.w) {
    player.y = player.y - player.speed; 
}
if(keyboard.s) {
    player.y = player.y + player.speed; 
}

text(20, 40, 30, "Poäng: " + poang, "black");

text(20, 80, 30, "Gifts:" + collectedGifts, "Black" )

text(20, 120, 30, "Level: " + level, "black");

text(1490, 470, 25, lämnaGifts +"/" + giftsneeded, "black") 











}
